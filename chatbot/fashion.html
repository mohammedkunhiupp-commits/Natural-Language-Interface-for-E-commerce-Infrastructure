<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Cluster // Apparel</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-main: #0f172a; 
            --bg-card: #1e293b; 
            --accent-pink: #ec4899; 
            --accent-green: #10b981; 
            --text-primary: #f8fafc; 
            --text-secondary: #94a3b8; 
            --border-color: #334155; 
        }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg-main); color: var(--text-primary); margin: 0; padding: 40px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 40px; }
        .header-section h1 { font-size: 24px; margin: 0; letter-spacing: -1px; }
        .header-section h1 span { color: var(--accent-pink); }
        .back-badge { background: rgba(236, 72, 153, 0.1); border: 1px solid var(--accent-pink); color: var(--accent-pink); padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .matrix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
        .apparel-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .portrait-viewport { height: 320px; overflow: hidden; background: #151f32; border-bottom: 1px solid var(--border-color); }
        .portrait-viewport img { width: 100%; height: 100%; object-fit: cover; }
        .apparel-details { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .brand-label { font-size: 12px; font-weight: 700; color: var(--accent-pink); text-transform: uppercase; margin-bottom: 4px; }
        .product-desc { font-size: 14px; color: var(--text-primary); margin-bottom: 16px; }
        .telemetry-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
        .btn-action { width: 100%; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-action:hover { background: var(--accent-pink); border-color: var(--accent-pink); }
    </style>
</head>
<body>
    <div class="header-section">
        <div>
            <h1>CLUSTER // <span>APPAREL_ASSETS</span></h1>
            <p id="ledgerTitle" style="color: var(--text-secondary); margin: 5px 0 0 0; font-size: 13px;">Relational Ledger: active_fashion_inventory</p>
        </div>
        <a href="index.html" class="back-badge">← RETURN TO TERMINAL</a>
    </div>

    <div class="matrix-grid">
        <div class="apparel-card" data-asset-type="hoodie">
            <div class="portrait-viewport"><img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400&auto=format&fit=crop&q=80"></div>
            <div class="apparel-details">
                <div>
                    <div class="brand-label">Aesthetic Wear</div>
                    <div class="product-desc">Over-Sized Heavy Hoodie</div>
                    <div class="telemetry-row"><span>Price:</span><span>₹1,899</span></div>
                    <div class="telemetry-row"><span>Pool:</span><span style="color: var(--accent-green);">450 Items</span></div>
                </div>
                <button class="btn-action">ALLOCATE MATRIX</button>
            </div>
        </div>

        <div class="apparel-card" data-asset-type="sneakers">
            <div class="portrait-viewport"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&auto=format&fit=crop&q=80"></div>
            <div class="apparel-details">
                <div>
                    <div class="brand-label">Stride Labs</div>
                    <div class="product-desc">Knit Minimalist Sneakers</div>
                    <div class="telemetry-row"><span>Price:</span><span>₹3,499</span></div>
                    <div class="telemetry-row"><span>Pool:</span><span style="color: var(--accent-green);">180 Items</span></div>
                </div>
                <button class="btn-action">ALLOCATE MATRIX</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetFilter = urlParams.get('filter');
            
            if (targetFilter) {
                document.getElementById('ledgerTitle').innerText = `Isolated Query Target Mode // Node: ${targetFilter.toUpperCase()}`;
                document.getElementById('ledgerTitle').style.color = "#ec4899";
                
                document.querySelectorAll('.apparel-card').forEach(card => {
                    if (card.getAttribute('data-asset-type') !== targetFilter) {
                        card.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>
